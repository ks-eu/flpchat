[package]
name = "server"
version = "0.1.0"
edition = "2024"
default-run = "server"

[features]
regremove-stress = []

[[bin]]
name = "lightchat-regremove-stress"
path = "stresstest/main.rs"
required-features = ["regremove-stress"]
test = false
bench = false

[dependencies]
flpc = {git = "https://github.com/ks-eu/flpc", package = "flpc", features = ["tokio"]}
futures-util = {version = "0.3.34", features = ["sink"]}
tokio = {version = "1.54.1", features = ["full"]}
tokio-util = "0.7.20"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "migrate"] }
dotenvy = "0.15.7"
argon2 = "0.6.0"
